/* Veri tarayıcının localStorage alanında tutulur (yalnızca bu cihazda). Çok cihazlı canlı yayın için
   window.storage.get/set fonksiyonlarını Firebase, Supabase vb. ile değiştirin. */
window.storage = {
  async get(k) { try { const v = localStorage.getItem(k); return v == null ? null : { key: k, value: v }; } catch (e) { return null; } },
  async set(k, v) { try { localStorage.setItem(k, v); return { key: k, value: v }; } catch (e) { return null; } }
};

/* Hakem girişi: şifre düz metin olarak değil SHA-256 özeti olarak saklanır. Oturum sekme kapanınca biter. */
(function () {

  const get = () => { try { return sessionStorage.getItem("mfl-ref") === H; } catch (e) { return false; } };
  window.MFL_AUTH = {
    async status() { return { exists: true, canSet: false, unlocked: get() }; },
    async unlock(p) { try { if ((await hash(p)) === H) { try { sessionStorage.setItem("mfl-ref", H); } catch (e) {} return true; } } catch (e) {} return false; },
    async set() { return false; },
