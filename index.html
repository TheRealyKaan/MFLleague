<script>
(async()=>{
let db=null,user=null,last='';
try{db=await claude.use('db')}catch(e){}
try{user=await claude.use('user')}catch(e){}
let canSet=false;
if(user){try{canSet=!!(await user.canEdit())}catch(e){}}
const ref=db?db.doc('league/main'):null,pref=db?db.doc('admin/pw'):null;
const COLS=['teams','matches','injuries','notices','mcl'];
const canon=x=>Array.isArray(x)?x.map(canon):x&&typeof x==='object'?Object.fromEntries(Object.keys(x).sort().map(k=>[k,canon(x[k])])):x;
const cj=x=>JSON.stringify(canon(x));
let cache={teams:{},matches:{},injuries:{},notices:{},mcl:{}},srv={teams:{},matches:{},injuries:{},notices:{},mcl:{}};
const loaded=new Set(),emitted=new WeakSet(),clone=o=>JSON.parse(JSON.stringify(o));
const assemble=m=>{const o={};COLS.forEach(c=>o[c]=Object.values(m[c]).map(v=>v.d));o.teams.sort((x,y)=>(x.order||0)-(y.order||0));o.injuries.sort((x,y)=>x.id-y.id);o.notices.sort((x,y)=>y.id-x.id);return o};
let emitCb=null;
window.store={
  sub(cb){
    if(!db){let v=null;try{v=JSON.parse(localStorage.getItem('mfl-data')||'null')}catch(e){}cb(v);setTimeout(()=>window.dispatchEvent(new Event('mfl-read-err')),0);return()=>{}}
    emitCb=cb;let first=true;
    const emit=m=>{const o=assemble(m);emitted.add(o);cb(o)};
    const done=async()=>{
      if(loaded.size<COLS.length)return;
      if(first){first=false;
        if(!Object.keys(cache.teams).length&&ref){try{const s=await ref.get();if(s.exists&&(s.data().teams||[]).length){cb(s.data());return}}catch(e){}}}
      emit(cache);
    };
    const un=COLS.map(c=>db.collection(c).onSnapshot(s=>{
      const m={};s.docs.forEach(x=>{const v=x.data();m[x.id]={j:cj(v),d:v}});
      cache[c]=m;srv[c]=clone(m);loaded.add(c);done();
    },()=>window.dispatchEvent(new Event('mfl-read-err'))));
    return()=>un.forEach(f=>f&&f());
  },
  async set(v){
    if(!db){try{localStorage.setItem('mfl-data',JSON.stringify(v))}catch(e){}return}
    if(emitted.has(v))return;
    const ops=[];
    COLS.forEach(c=>{
      const ids=new Set();
      (v[c]||[]).forEach(it=>{const id=String(it.id),j=cj(it);ids.add(id);if(!cache[c][id]||cache[c][id].j!==j){cache[c][id]={j,d:it};ops.push(()=>db.doc(c+'/'+id).set(it))}});
      Object.keys(cache[c]).forEach(id=>{if(!ids.has(id)){delete cache[c][id];ops.push(()=>db.doc(c+'/'+id).delete())}});
    });
    try{for(let i=0;i<ops.length;i+=6)await Promise.all(ops.slice(i,i+6).map(f=>f()))}
    catch(e){window.dispatchEvent(new Event('mfl-err'));cache=clone(srv);if(emitCb){const o=assemble(cache);emitted.add(o);emitCb(o)}}
  }
};
/* Giriş: tuzlu PBKDF2 özetleri admin/pw (yönetici) ve admin/ref (hakem) belgelerinde saklanır, şifreler hiçbir yere yazılmaz */
const enc=new TextEncoder(),b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),unb=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function derive(pw,salt){const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);return b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},k,256))}
const loadDoc=async n=>{if(!db)return null;try{const s=await db.doc('admin/'+n).get();return s.exists?s.data():null}catch(e){return null}};
const rd=()=>{try{return JSON.parse(sessionStorage.getItem('mfl-sess')||'{}')}catch(e){return{}}},wr=o=>{try{sessionStorage.setItem('mfl-sess',JSON.stringify(o))}catch(e){}};
window.MFL_AUTH={
  async status(){const [a,r]=await Promise.all([loadDoc('pw'),loadDoc('ref')]),t=rd();let role='';
    if(t.role==='admin'&&a&&t.h===a.hash)role='admin';else if(t.role==='ref'&&r&&t.h===r.hash)role='ref';
    return{admin:!!a,ref:!!r,canSet,role,refId:role==='ref'?(t.refId||null):null}},
  async unlock(pw){const [a,r]=await Promise.all([loadDoc('pw'),loadDoc('ref')]);
    for(const [role,doc] of [['admin',a],['ref',r]]){if(!doc)continue;const h=await derive(pw,unb(doc.salt));if(h===doc.hash){wr({role,h});return role}}
    await new Promise(x=>setTimeout(x,900));return ''},
  async set(which,pw){if(!db||!canSet)return false;const salt=crypto.getRandomValues(new Uint8Array(16)),h=await derive(pw,salt);
    try{await db.doc('admin/'+(which==='admin'?'pw':'ref')).set({salt:b64(salt),hash:h});const t=rd();if(t.role===which)wr({...t,h});return true}catch(e){return false}},
  setRef(id){wr({...rd(),refId:id})},
  lock(){try{sessionStorage.removeItem('mfl-sess')}catch(e){}}
};
let uid=null;if(user){try{uid=String(await user.id())}catch(e){}}
window.MFL_POLL={uid,sub(cb){if(!db)return()=>{};return db.collection('votes').onSnapshot(s=>{const o=[];s.docs.forEach(x=>{const v=x.data()||{};Object.keys(v).forEach(m=>o.push({m,s:v[m],u:x.id}))});cb(o)},()=>{})},async vote(m,c){if(!db||!uid||uid.includes('/'))return false;try{const r=db.doc('votes/'+uid);let cur={};try{const g=await r.get();if(g.exists)cur=g.data()||{}}catch(e){}cur[m]=c;await r.set(cur);return true}catch(e){return false}}};

const CSS = `
.mfl{--fh:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--bg:#f6f1f2;--card:#fff;--tx:#1c0b10;--mu:#75696e;--ln:#eadfe2;--in:#f4eef0;--ac:#d4202f;--gold:#ffc83d;--live:#e5233d;--ok:#12a36b;--no:#e5233d;
background:transparent;color:var(--tx);min-height:100vh;z-index:0;font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;position:relative;overflow-x:hidden}
.mfl *{box-sizing:border-box}
.mfl .ct{max-width:1240px;margin:0 auto;padding:0 16px}
.mfl .pg{padding-bottom:60px}
/* üst bant ve başlık */
.mfl .top{position:sticky;top:0;z-index:30;background:rgba(28,11,16,.94);backdrop-filter:blur(8px);color:#fff;box-shadow:0 4px 20px #0006}
.mfl .tk{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:8px 14px;background:#0e0508;font-size:12px;scrollbar-width:none}
.mfl .tk .wk{flex:none;display:flex;gap:7px;align-items:center;font:700 13px var(--fh);letter-spacing:1.5px;margin-right:8px;color:#fff3f4;text-transform:uppercase}
.mfl .tk b{flex:none;display:flex;align-items:center;gap:7px;padding:0 10px;border-left:1px solid #ffffff14;font-weight:600;cursor:pointer;color:#e8c3c8}
.mfl .tk b em{font-style:normal;background:#2a1117;border-radius:6px;padding:3px 8px;color:#fff;font:700 14px var(--fh);letter-spacing:1px}
.mfl .tk b.lv em{background:var(--live)}
.mfl .hd{display:flex;align-items:center;justify-content:space-between;gap:14px;max-width:1440px;margin:0 auto;padding:10px 16px}
.mfl .logo{display:flex;align-items:center;gap:12px;cursor:pointer;flex:none}
.mfl .logo b{font:800 26px/1 var(--fh);letter-spacing:.5px;display:block;text-transform:uppercase}
.mfl .logo small{font:600 11px var(--fh);letter-spacing:2.6px;color:#d9a5ac;text-transform:uppercase}
.mfl nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.mfl nav button{flex:none;border:0;background:none;color:#f0d3d7;padding:12px 8px;font:700 15px var(--fh);letter-spacing:1.1px;text-transform:uppercase;border-bottom:2px solid transparent;cursor:pointer;transition:color .2s}
.mfl nav button:hover{color:#fff}.mfl nav button.on{color:#fff;border-color:var(--gold)}.mfl nav button.lvt{color:#ff8a98}
@media(max-width:900px){.mfl .hd{flex-direction:column;align-items:flex-start;gap:0}.mfl nav{width:100%}}
/* giriş alanı */
.mfl .hero{position:relative;overflow:hidden;color:#fff;background:radial-gradient(90% 120% at 100% 0,rgba(138,16,32,.9) 0,rgba(26,9,13,.88) 55%,rgba(18,6,10,.92));padding:64px 0 130px}
.mfl .hero .ct{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;position:relative;z-index:1}
.mfl .hero .ct>div:first-child{animation:rise .8s both}
.mfl .pitch i{position:absolute;border:1px solid #ffffff12;pointer-events:none}
.mfl .pitch i:nth-child(1){left:50%;top:0;bottom:0;border-width:0 0 0 1px}
.mfl .pitch i:nth-child(2){left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%}
.mfl .pitch i:nth-child(3){left:-2%;top:28%;width:12%;height:44%}
.mfl .pitch i:nth-child(4){right:-2%;top:28%;width:12%;height:44%}
.mfl .eb{display:flex;align-items:center;gap:12px;font:700 13px var(--fh);letter-spacing:2.6px;color:#75696e;text-transform:uppercase}
.mfl .eb::before{content:"";width:28px;height:2px;background:#ff4d5e}
.mfl .hero .eb{color:#d9a5ac}
.mfl .hero h1{font:800 clamp(64px,11vw,132px)/.88 var(--fh);margin:18px 0 0;text-transform:uppercase;background:linear-gradient(#fff 25%,#d9a5ac);-webkit-background-clip:text;background-clip:text;color:transparent}
.mfl .hero h1::after{content:"";display:block;width:190px;height:6px;border-radius:6px;margin-top:14px;background:linear-gradient(90deg,#d4202f,transparent)}
.mfl .hero p{max-width:480px;color:#ecc9ce;font-size:18px;margin:18px 0}
.mfl .chips{display:flex;gap:8px;flex-wrap:wrap}.mfl .chips span{border:1px solid #ffffff22;background:#ffffff0d;border-radius:99px;padding:6px 13px;font-size:13px;font-weight:600}
.mfl .hb{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
.mfl .pill{border-radius:99px;padding:14px 26px;font:800 16px var(--fh);letter-spacing:1.4px;text-transform:uppercase;border:1px solid #ffffff33;background:none;color:#fff;cursor:pointer;transition:transform .2s,background .2s}
.mfl .pill:hover{transform:translateY(-2px);background:#ffffff14}.mfl .pill.b{background:#d4202f;border-color:#d4202f;box-shadow:0 10px 28px -8px #d4202faa}.mfl .pill.b:hover{background:#e8323f}
.mfl .hero .bdg{justify-self:center;display:grid;place-items:center;animation:float2 7s ease-in-out infinite}
.mfl .hero .bdg svg,.mfl .hero .bdg img{filter:drop-shadow(0 24px 50px #000b);max-width:100%;height:auto}
.mfl img.blogo{display:block;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px #ffffff40}
.mfl .tc{cursor:pointer}.mfl .tc .tgo{color:#d4202f;font-weight:700;margin-top:8px;opacity:.85}.mfl .tc:hover .tgo{opacity:1}
.mfl .tr .nm:hover span:last-child{text-decoration:underline}
.mfl .tmh{display:flex;align-items:center;gap:18px;padding:20px;flex-wrap:wrap}
.mfl .tmi b{display:block;font:800 36px/1 var(--fh);text-transform:uppercase}.mfl .tmi small{color:var(--mu);font-size:14px}
.mfl .tms{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.mfl .tms span{min-width:76px;text-align:center;background:var(--in);border-radius:12px;padding:8px 12px;font:700 11px var(--fh);letter-spacing:1.5px;text-transform:uppercase;color:var(--mu)}
.mfl .tms span b{display:block;font:800 26px/1.1 var(--fh);color:var(--tx);letter-spacing:0}
.mfl .plh,.mfl .plr{display:grid;grid-template-columns:28px 1fr 54px 54px 40px 40px;align-items:center;gap:4px;padding:10px 16px;border-bottom:1px solid var(--ln);text-align:center}
.mfl .plh{font:700 12px var(--fh);letter-spacing:1.5px;color:var(--mu);text-transform:uppercase;background:#f7f9fc}
.mfl .plr:last-child{border-bottom:0}.mfl .plr:hover{background:#f6f8fc}
.mfl .plr .n{color:var(--mu);font:800 16px var(--fh)}
.mfl .plr .pn{text-align:left;min-width:0}.mfl .plr .pn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mfl .plr .pn small{display:block;color:var(--mu);font-size:12px}.mfl .plr .pn small.sk{color:#c81e36}
.mfl .plr .v{font:800 22px var(--fh)}.mfl .plr .z{color:#c5cbd8;font:700 16px var(--fh)}
.mfl .plr.best{background:linear-gradient(90deg,#ffc83d33,#fff 70%);box-shadow:inset 4px 0 #ffc83d}
@media(max-width:560px){.mfl .tms{margin-left:0;width:100%}.mfl .tms span{flex:1;min-width:0;padding:8px 6px}.mfl .plh,.mfl .plr{grid-template-columns:22px 1fr 44px 46px 32px 32px;padding:10px 10px}}
.mfl .hero .bdg img.blogo{box-shadow:0 0 0 4px #ffffff55}
